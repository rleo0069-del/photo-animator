<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Animator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 30px auto; padding: 20px; background: #111; color: #eee; }
    h1 { font-size: 1.8rem; }
    button, input, select, textarea { font-size: 1rem; padding: 8px 12px; margin: 4px; }
    #preview { width: 100%; max-width: 800px; background: #000; margin: 20px 0; border-radius: 8px; }
    .photo-list { display: flex; flex-wrap: wrap; gap: 12px; margin: 15px 0; }
    .photo-item { background: #222; padding: 10px; border-radius: 8px; width: 180px; }
    .photo-item img { width: 160px; height: 100px; object-fit: cover; border-radius: 4px; }
    .photo-item input, .photo-item select, .photo-item textarea { width: 100%; box-sizing: border-box; }
    textarea { height: 50px; resize: vertical; }
  </style>
</head>
<body>
  <h1>Photo Animator</h1>
  <p>Upload photos → set duration, text, and animation style → add music → preview & export.</p>

  <input type="file" id="fileInput" multiple accept="image/*">
  <div class="photo-list" id="photoList"></div>

  <label>Default duration (sec): <input type="number" id="defaultDuration" value="3" min="0.5" max="30" step="0.5"></label><br>
  <label>Background music: <input type="file" id="musicInput" accept="audio/*"></label><br>
  <label>Crossfade duration (sec): <input type="number" id="crossfadeDuration" value="0.8" min="0" max="3" step="0.1"></label><br><br>

  <button id="previewBtn">Preview</button>
  <button id="exportBtn">Export Video</button>

  <canvas id="preview" width="1280" height="720"></canvas>
  <p id="status"></p>

  <script src="app.js"></script>
</body>
</html>
