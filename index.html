<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Animator</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #111; color: #eee; }
    h1 { font-size: 1.8rem; }
    button, input { font-size: 1rem; padding: 8px 12px; margin: 5px; }
    #preview { width: 100%; max-width: 800px; background: #000; margin: 20px 0; border-radius: 8px; }
    .photo-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; }
    .photo-item { position: relative; }
    .photo-item img { width: 120px; height: 80px; object-fit: cover; border-radius: 4px; }
    .photo-item input { width: 60px; }
  </style>
</head>
<body>
  <h1>Photo Animator</h1>
  <p>Upload photos, set duration, preview, and export a video.</p>

  <input type="file" id="fileInput" multiple accept="image/*">
  <div class="photo-list" id="photoList"></div>

  <label>Default duration (seconds): <input type="number" id="defaultDuration" value="3" min="1" max="30" step="0.5"></label><br>
  <button id="previewBtn">Preview</button>
  <button id="exportBtn">Export Video</button>

  <canvas id="preview" width="1280" height="720"></canvas>
  <p id="status"></p>

  <script src="app.js"></script>
</body>
</html>
